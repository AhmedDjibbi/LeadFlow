<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="ContentFlow AI content generation dashboard">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121222"/><stop offset="1" stop-color="#090911"/>
    </linearGradient>
    <linearGradient id="generate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="insta" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f9ce34"/><stop offset=".5" stop-color="#ee2a7b"/><stop offset="1" stop-color="#6228d7"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="shell"><rect width="720" height="520" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#shell)">
    <rect width="720" height="520" fill="url(#panel)"/>

    <!-- header -->
    <rect x="0" y="0" width="720" height="58" fill="#0d0d1a"/>
    <line x1="0" y1="58" x2="720" y2="58" stroke="#20203a"/>
    <circle cx="27" cy="29" r="12" fill="#8b5cf6" opacity=".18"/>
    <rect x="20" y="22" width="14" height="14" rx="4" fill="url(#mark)"/>
    <text x="44" y="34" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#eeeaff">ContentFlow AI</text>
    <path d="M688 24l12 12M700 24l-12 12" stroke="#5d5d78" stroke-width="1.5" stroke-linecap="round"/>

    <!-- sidebar -->
    <rect x="0" y="59" width="186" height="461" fill="#08080f"/>
    <line x1="186" y1="59" x2="186" y2="520" stroke="#1d1d33"/>

    <g font-family="Inter, Segoe UI, sans-serif" font-size="10.5">
      <rect x="12" y="78" width="162" height="34" rx="9" fill="#2b2059"/>
      <g stroke="#cfc6ff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="24" y="88" width="6" height="6" rx="1.5"/><rect x="33" y="88" width="6" height="6" rx="1.5"/>
        <rect x="24" y="97" width="6" height="6" rx="1.5"/><rect x="33" y="97" width="6" height="6" rx="1.5"/>
      </g>
      <text x="48" y="99" fill="#e4ddff" font-weight="500">Dashboard</text>

      <g stroke="#82829c" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="24" y="122" width="15" height="15" rx="3.5"/><path d="M31.5 125.5v8M27.5 129.5h8"/>
      </g>
      <text x="48" y="133" fill="#9c9cb6">Create Content</text>

      <g stroke="#82829c" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="31.5" cy="163" r="6.5"/><path d="M31.5 160v3.5l2.5 1.5"/>
      </g>
      <text x="48" y="167" fill="#9c9cb6">History</text>

      <g stroke="#82829c" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="31.5" cy="197" r="3"/><path d="M31.5 188.5v2M31.5 204v2M23 197h2M38 197h2M25.5 191l1.4 1.4M36 201.5l1.4 1.4M25.5 203l1.4-1.4M36 192.5l1.4-1.4"/>
      </g>
      <text x="48" y="201" fill="#9c9cb6">Settings</text>
    </g>

    <!-- main -->
    <g font-family="Inter, Segoe UI, sans-serif" text-anchor="middle">
      <text x="453" y="152" font-size="20" font-weight="700" fill="#f4f2ff" letter-spacing="-.3">Create Amazing</text>
      <text x="453" y="178" font-size="20" font-weight="700" fill="#f4f2ff" letter-spacing="-.3">Social Media Content</text>
      <text x="453" y="201" font-size="10" fill="#8d8da6">Turn your ideas into engaging content with AI.</text>
    </g>

    <rect x="208" y="224" width="366" height="44" rx="12" fill="#151528" stroke="#2a2a46"/>
    <text x="228" y="251" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#6f6f8c">Enter a topic...</text>
    <circle cx="228" cy="248" r="4" fill="none" stroke="#5d5d7a" stroke-width="1.2"/>
    <path d="M231 251l3 3" stroke="#5d5d7a" stroke-width="1.2" stroke-linecap="round"/>

    <rect x="480" y="231" width="86" height="30" rx="8" fill="url(#generate)"/>
    <text x="523" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="500" fill="#ffffff" text-anchor="middle">Generate ✦</text>

    <!-- social channels -->
    <g transform="translate(360,318)">
      <circle r="14" fill="#ff4500"/>
      <g fill="#ffffff">
        <ellipse cx="0" cy="0" rx="7" ry="5.4"/>
        <circle cx="-2.6" cy="-1" r="1.4" fill="#ff4500"/>
        <circle cx="2.6" cy="-1" r="1.4" fill="#ff4500"/>
        <circle cx="-7.5" cy="-4" r="2"/><circle cx="7.5" cy="-4" r="2"/>
        <path d="M0-5.4l1.5-5 3.5.6" fill="none" stroke="#fff" stroke-width="1.2"/>
        <circle cx="5.6" cy="-9.8" r="1.7"/>
      </g>

      <g transform="translate(46,0)">
        <rect x="-11" y="-11" width="22" height="22" rx="6.5" fill="url(#insta)"/>
        <rect x="-7" y="-7" width="14" height="14" rx="4.5" fill="none" stroke="#fff" stroke-width="1.4"/>
        <circle cx="0" cy="0" r="3.2" fill="none" stroke="#fff" stroke-width="1.4"/>
        <circle cx="5.4" cy="-5.4" r="1.2" fill="#fff"/>
      </g>

      <g transform="translate(92,0)">
        <circle r="14" fill="#141422" stroke="#333350"/>
        <path d="M-5.5-6.5l13 6.5-13 6.5 2.4-6.5z" fill="#ffffff"/>
      </g>

      <g transform="translate(138,0)">
        <rect x="-11" y="-11" width="22" height="22" rx="5" fill="#0a66c2"/>
        <text x="0" y="4.5" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#fff">in</text>
      </g>

      <g transform="translate(184,0)">
        <circle r="14" fill="#101020" stroke="#333350"/>
        <path d="M2.5-8c.4 2.4 1.8 3.9 4.1 4.2v2.6c-1.6.1-3-.4-4.2-1.3v4.2c0 2.9-2.2 4.7-4.6 4.4-2.2-.3-3.7-2.2-3.4-4.4.3-2 1.9-3.3 3.9-3.3.4 0 .8 0 1.2.1v2.9c-.4-.1-.8-.2-1.1-.1-1 .1-1.6.9-1.5 1.8.1.9.9 1.5 1.8 1.4.9-.1 1.5-.8 1.5-1.7z" fill="#ffffff"/>
      </g>
    </g>

    <!-- subtle bottom fade -->
    <rect x="186" y="400" width="534" height="120" fill="#090911" opacity=".0"/>
  </g>
  <rect x=".5" y=".5" width="719" height="519" rx="16" fill="none" stroke="#2b2b48"/>
</svg>
