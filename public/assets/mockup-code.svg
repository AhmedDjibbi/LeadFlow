<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="Code editor showing a LeadFlow integration">
  <defs>
    <linearGradient id="codebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101020"/><stop offset="1" stop-color="#08080f"/>
    </linearGradient>
    <clipPath id="shell"><rect width="560" height="470" rx="13"/></clipPath>
  </defs>
  <g clip-path="url(#shell)">
    <rect width="560" height="470" fill="url(#codebg)"/>

    <!-- window controls -->
    <circle cx="22" cy="22" r="5" fill="#ff5f57" opacity=".9"/>
    <circle cx="40" cy="22" r="5" fill="#febc2e" opacity=".9"/>
    <circle cx="58" cy="22" r="5" fill="#28c840" opacity=".9"/>

    <!-- tabs -->
    <rect x="0" y="42" width="560" height="26" fill="#0c0c18"/>
    <rect x="16" y="42" width="96" height="26" fill="#131327"/>
    <rect x="16" y="66" width="96" height="2" fill="#8b5cf6"/>
    <text x="30" y="59" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#c9c4ee">app.tsx</text>
    <text x="128" y="59" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#5f5f7a">model.py</text>

    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">
      <!-- line numbers -->
      <g fill="#41415c" text-anchor="end">
        <text x="24" y="92">1</text><text x="24" y="111">2</text><text x="24" y="130">3</text>
        <text x="24" y="149">4</text><text x="24" y="168">5</text><text x="24" y="187">6</text>
        <text x="24" y="206">7</text><text x="24" y="225">8</text><text x="24" y="244">9</text>
        <text x="24" y="263">10</text><text x="24" y="282">11</text><text x="24" y="301">12</text>
        <text x="24" y="320">13</text><text x="24" y="339">14</text><text x="24" y="358">15</text>
      </g>

      <!-- active line highlight -->
      <rect x="34" y="230" width="510" height="18" fill="#8b5cf6" opacity=".10"/>

      <g>
        <text x="40" y="92"><tspan fill="#c084fc">import</tspan><tspan fill="#8b8ba8"> { </tspan><tspan fill="#7dd3fc">LeadFlow</tspan><tspan fill="#8b8ba8"> } </tspan><tspan fill="#c084fc">from</tspan><tspan fill="#86efac"> '@leadflow/sdk'</tspan><tspan fill="#8b8ba8">;</tspan></text>
        <text x="40" y="111"><tspan fill="#c084fc">import</tspan><tspan fill="#8b8ba8"> { </tspan><tspan fill="#7dd3fc">useState</tspan><tspan fill="#8b8ba8"> } </tspan><tspan fill="#c084fc">from</tspan><tspan fill="#86efac"> 'react'</tspan><tspan fill="#8b8ba8">;</tspan></text>

        <text x="40" y="149"><tspan fill="#c084fc">export default function</tspan><tspan fill="#e2e0f5"> App</tspan><tspan fill="#8b8ba8">() {</tspan></text>
        <text x="40" y="168"><tspan fill="#8b8ba8">  </tspan><tspan fill="#c084fc">const</tspan><tspan fill="#8b8ba8"> [</tspan><tspan fill="#e2e0f5">draft</tspan><tspan fill="#8b8ba8">, </tspan><tspan fill="#7dd3fc">setDraft</tspan><tspan fill="#8b8ba8">] = </tspan><tspan fill="#7dd3fc">useState</tspan><tspan fill="#8b8ba8">(</tspan><tspan fill="#f0a26b">null</tspan><tspan fill="#8b8ba8">);</tspan></text>
        <text x="40" y="187"></text>
        <text x="40" y="206"><tspan fill="#8b8ba8">  </tspan><tspan fill="#c084fc">async function</tspan><tspan fill="#e2e0f5"> generate</tspan><tspan fill="#8b8ba8">() {</tspan></text>
        <text x="40" y="225"><tspan fill="#8b8ba8">    </tspan><tspan fill="#c084fc">const</tspan><tspan fill="#8b8ba8"> res = </tspan><tspan fill="#c084fc">await</tspan><tspan fill="#7dd3fc"> LeadFlow</tspan><tspan fill="#8b8ba8">.</tspan><tspan fill="#e2e0f5">generate</tspan><tspan fill="#8b8ba8">({</tspan></text>
        <text x="40" y="244"><tspan fill="#8b8ba8">      prompt: </tspan><tspan fill="#86efac">'social post'</tspan><tspan fill="#8b8ba8">,</tspan></text>
        <text x="40" y="263"><tspan fill="#8b8ba8">      tone: </tspan><tspan fill="#86efac">'bold'</tspan><tspan fill="#8b8ba8">,</tspan></text>
        <text x="40" y="282"><tspan fill="#8b8ba8">    });</tspan></text>
        <text x="40" y="301"><tspan fill="#8b8ba8">    </tspan><tspan fill="#7dd3fc">setDraft</tspan><tspan fill="#8b8ba8">(res);</tspan></text>
        <text x="40" y="320"><tspan fill="#8b8ba8">  }</tspan></text>
        <text x="40" y="339"></text>
        <text x="40" y="358"><tspan fill="#8b8ba8">  </tspan><tspan fill="#c084fc">return</tspan><tspan fill="#8b8ba8"> &lt;</tspan><tspan fill="#7dd3fc">Dashboard</tspan><tspan fill="#8b8ba8"> draft={draft} /&gt;;</tspan></text>
        <text x="40" y="377"><tspan fill="#8b8ba8">}</tspan></text>
      </g>
    </g>

    <!-- status bar -->
    <rect x="0" y="446" width="560" height="24" fill="#0d0d1a"/>
    <text x="18" y="461" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#6f6f8c">◉ AI Assistant ready</text>
  </g>
  <rect x=".5" y=".5" width="559" height="469" rx="13" fill="none" stroke="#2b2b48"/>
</svg>
